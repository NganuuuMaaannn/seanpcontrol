; PlatformIO Project Configuration File
;
; SeanPControl Firmware for ESP32 DevKit V1
;

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; Serial Monitor
monitor_filters = esp32_exception_decoder